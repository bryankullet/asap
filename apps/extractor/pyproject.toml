[project]
name = "asap-extractor"
version = "0.1.0"
description = "ASAP document extraction service. Phase 1: health endpoint and a no-op queue consumer. Phase 3: text, tables and page positions."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  # Reads documents in this process. The point of it is that nothing leaves our own
  # infrastructure (§45 rule 2), so a hosted extraction API is not an option here.
  "pymupdf>=1.24",
  # Multipart bodies: the API posts the document as a file.
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
