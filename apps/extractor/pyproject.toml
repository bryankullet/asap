[project]
name = "asap-extractor"
version = "0.1.0"
description = "ASAP document extraction service. Phase 1: health endpoint and a no-op queue consumer. Phase 3: text, tables and page positions."
requires-python = ">=3.11"
# Pinned, not floated (D-077). `>=` meant the version that reached Render was whatever PyPI
# happened to serve that day, and the version the tests ran against was whatever a sandbox had
# been given by hand — so a green test run said nothing about whether the deployed service could
# start. requirements.lock.txt pins what these pull in as well.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  # Reads documents in this process. The point of it is that nothing leaves our own
  # infrastructure (§45 rule 2), so a hosted extraction API is not an option here.
  "pymupdf==1.28.2",
  # Multipart bodies: the API posts the document as a file.
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.14.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
