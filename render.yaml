# Render blueprint for the ASAP web app as a static site (UI Build Spec v1, Part 12: "each phase
# ends somewhere previewable on Render"). The browser receives the Supabase anon key only
# (Architecture §45 rule 4); the build fails if anything else reaches the bundle
# (apps/web/scripts/check-bundle.mjs). Values are set in the Render dashboard, never here.
services:
  # Hono API. Node, not an edge runtime: SSE run streams need a long-lived process (spec Part 1.2).
  - type: web
    name: asap-api
    runtime: node
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @asap/api... build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - key: APP_ENV
        value: staging
      - key: API_PORT
        fromService:
          type: web
          name: asap-api
          envVarKey: PORT
      # Public addresses, set in the dashboard (D-049 correction). `fromService … property: host`
      # hands over a service's private-network hostname, which a browser can never reach: the
      # API's CORS origin must equal the browser's public origin, and the API's own base URL is
      # what people receive in links. Both are the `https://….onrender.com` (or custom-domain)
      # URLs shown on each service's dashboard page, no trailing slash.
      - key: API_BASE_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      # Everything below is set in the dashboard; values never live in this file.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      # Generated by Render; the API registers its hash with the database on boot (0025).
      - key: API_INTERNAL_KEY
        generateValue: true
      # Optional: absent means the feature is disabled with a startup log line (D-046).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # --- Ask ASAP's gateway (D-061). All optional -------------------------------------------
      # With no key and no model, the gateway resolves to nothing, the API logs that it is
      # disabled, and Ask answers with its configuration-required state — which says a model is
      # not connected and names no provider. That is a designed state, not a failure, so the
      # service boots and every other surface works untouched.
      #
      # Set OPENAI_API_KEY and AI_MODEL together to switch Ask on. Neither ever reaches the
      # browser: there is no VITE_ equivalent of either, and the bundle check would fail the
      # build if the name appeared (§45 rule 4).
      - key: AI_DEFAULT_PROVIDER
        value: openai
      - key: AI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # --- Documents and mailboxes. All optional ----------------------------------------------
      # Extraction runs on our own service (§45 rule 2); until one is deployed, documents still
      # upload and read, and extraction simply has not run.
      - key: EXTRACTOR_URL
        sync: false
      - key: EXTRACTOR_SHARED_SECRET
        sync: false
      # OAuth for connected mailboxes. Absent means no mailbox can be connected, which the
      # mailbox surface says; nothing else is affected.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_TENANT_ID
        sync: false
      - key: MICROSOFT_OAUTH_REDIRECT_URI
        sync: false

  - type: web
    name: asap-web
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @asap/web... build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: true
    routes:
      # Client-side routing: every path serves the app shell (TanStack Router).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_PUBLIC_APP_ENV
        value: staging
      - key: VITE_PUBLIC_SUPABASE_URL
        sync: false
      - key: VITE_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # The API's public URL, set in the dashboard (D-049 correction): this is baked into the
      # bundle at build time and used by browsers, so it can never be the private-network host
      # that `fromService … property: host` provides.
      - key: VITE_PUBLIC_API_BASE_URL
        sync: false
      # The first Renewal Space (D-058, D-059). "off" keeps the existing record page for every
      # kind, which is the rollback: flip to "on" in the dashboard and redeploy the static site.
      - key: VITE_PUBLIC_RENEWAL_SPACE
        value: "off"
      - key: NODE_VERSION
        value: "22.22.2"

  # Python document extraction (§45 rule 2: documents are read on our own service, never sent to a
  # third party for indexing). Its only caller is the API, over the shared secret below — it never
  # serves a browser and never sees a session.
  - type: web
    name: asap-extractor
    runtime: python
    rootDir: apps/extractor
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: python -m asap_extractor.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: staging
      # The service reads its own port from EXTRACTOR_PORT; Render supplies PORT.
      - key: EXTRACTOR_PORT
        fromService:
          type: web
          name: asap-extractor
          envVarKey: PORT
      # The same value must be set on asap-api's EXTRACTOR_SHARED_SECRET. Set in the dashboard:
      # a generated value here could not be shared with a service in another blueprint entry
      # without one of them holding the other's copy.
      - key: EXTRACTOR_SHARED_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info

  # The worker tier (D-072). A background worker, not a web service: it opens no port. It claims
  # events and asks the API to run the consumers — it holds no service-role key, and connects as
  # asap_worker, which does not bypass RLS (§45, "Tenancy").
  - type: worker
    name: asap-worker
    runtime: node
    rootDir: .
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @asap/workers... build
    startCommand: node apps/workers/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - key: APP_ENV
        value: staging
      # asap_worker's connection string, not postgres'. The env schema refuses the postgres role.
      - key: WORKER_DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Where the engine lives, and the secret that proves the caller is not a browser. Both are
      # taken from the API service itself, so they cannot drift apart.
      - key: API_BASE_URL
        fromService:
          type: web
          name: asap-api
          envVarKey: API_BASE_URL
      - key: API_INTERNAL_KEY
        fromService:
          type: web
          name: asap-api
          envVarKey: API_INTERNAL_KEY
      - key: EVENT_POLL_MS
        value: "2000"
      # Required once APP_ENV is not local (packages/schema/src/env/worker.ts).
      - key: SENTRY_DSN
        sync: false
