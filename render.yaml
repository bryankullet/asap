# Render blueprint for the ASAP web app as a static site (UI Build Spec v1, Part 12: "each phase
# ends somewhere previewable on Render"). The browser receives the Supabase anon key only
# (Architecture §45 rule 4); the build fails if anything else reaches the bundle
# (apps/web/scripts/check-bundle.mjs). Values are set in the Render dashboard, never here.
services:
  # Hono API. Node, not an edge runtime: SSE run streams need a long-lived process (spec Part 1.2).
  - type: web
    name: asap-api
    runtime: node
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @asap/api... build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - key: APP_ENV
        value: staging
      - key: API_PORT
        fromService:
          type: web
          name: asap-api
          envVarKey: PORT
      # Service addresses come from Render itself; the env loader turns a host into https://<host>.
      - key: API_BASE_HOST
        fromService:
          type: web
          name: asap-api
          property: host
      - key: WEB_BASE_HOST
        fromService:
          type: web
          name: asap-web
          property: host
      # Everything below is set in the dashboard; values never live in this file.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      # Generated by Render; the API registers its hash with the database on boot (0025).
      - key: API_INTERNAL_KEY
        generateValue: true
      # Optional: absent means the feature is disabled with a startup log line (D-046).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: asap-web
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @asap/web... build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: true
    routes:
      # Client-side routing: every path serves the app shell (TanStack Router).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_PUBLIC_APP_ENV
        value: staging
      - key: VITE_PUBLIC_SUPABASE_URL
        sync: false
      - key: VITE_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PUBLIC_API_BASE_HOST
        fromService:
          type: web
          name: asap-api
          property: host
      - key: NODE_VERSION
        value: "22.22.2"
